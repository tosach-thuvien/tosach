<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Quản lý · Tổ sách</title>
<meta name="theme-color" content="#8E4F24">
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Lora:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
.wrap.wide{max-width:960px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--grey-bg);border-radius:10px;padding:10px 14px}
.stat b{display:block;font-size:22px;font-weight:600}
.stat span{font-size:13px;color:var(--muted)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tab{border:1px solid var(--border-strong);background:#fff;border-radius:999px;padding:7px 13px;font-size:14px;cursor:pointer;font-family:inherit;color:var(--text)}
.tab.on{background:var(--brown);border-color:var(--brown);color:#fff}
.tab .n{display:inline-block;min-width:18px;text-align:center;font-size:12px;border-radius:999px;padding:0 6px;margin-left:5px;background:var(--err);color:#fff}
.item{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.item .info{flex:1;min-width:220px}
.item .acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.kv{font-size:13.5px;color:var(--muted);margin:2px 0 0}
.kv b{color:var(--text);font-weight:500}
.inline-form{display:flex;gap:6px;flex-wrap:wrap;width:100%;margin-top:8px}
.inline-form input{flex:1;min-width:160px;padding:8px 10px;font-size:14px}
/* ===== Nhãn QR: 2,5 x 3 cm, 40 nhãn / A4 (5 cột x 8 hàng) ===== */
.sheet{width:210mm;height:297mm;background:#fff;margin:0 auto 14px;padding:14mm 0 0;box-shadow:0 0 0 1px var(--border);display:grid;
  grid-template-columns:repeat(5,25mm);grid-auto-rows:30mm;column-gap:6mm;row-gap:2.5mm;justify-content:center;align-content:start;overflow:hidden}
.label{width:25mm;height:30mm;border:0.2mm dashed #bbb;display:flex;flex-direction:column;align-items:center;padding:1mm 0.8mm 0;overflow:hidden}
.label .q{width:21.5mm;height:21.5mm}
.label .q svg{width:100%;height:100%;display:block}
.label .c{font:700 7.5pt/1.1 Arial,sans-serif;margin-top:0.6mm;color:#000;letter-spacing:.2px}
.label .t{font:6pt/1.15 Arial,sans-serif;color:#222;width:100%;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:0.4mm}
.preview-box{overflow-x:auto;background:var(--grey-bg);padding:14px;border-radius:12px}
@media print{
  @page{size:A4;margin:0}
  body{background:#fff}
  body *{visibility:hidden}
  #in-nhan, #in-nhan *{visibility:visible}
  #in-nhan{position:absolute;left:0;top:0}
  .preview-box{padding:0;background:none;overflow:visible}
  .sheet{margin:0;box-shadow:none;page-break-after:always;break-after:page}
}
</style>
</head>
<body>
<header class="top"><div class="wrap wide">
  <img class="logo-img" src="img/logo.jpg" alt="Logo Tổ sách" width="48" height="48">
  <div><h1>Tổ sách · Quản lý</h1><small>Dành cho chủ thư viện</small></div>
  <div style="margin-left:auto" id="top-acts"></div>
</div></header>
<main><div class="wrap wide" id="view"></div></main>
<script src="js/config.js"></script>
<script src="js/qr.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
